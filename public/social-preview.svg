  <ellipse cx="900" cy="300" rx="430" ry="360" fill="url(#glow)"/>
  <path d="M0 84H1200M0 546H1200" stroke="#ffffff" stroke-opacity=".12"/>
  <path d="M82 0V630M1118 0V630" stroke="#ffffff" stroke-opacity=".07"/>
